[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "texflux"
version = "0.1.0"
description = "A TeX-first indentation-based preprocessor for structural LaTeX boilerplate"
requires-python = ">=3.11"
dependencies = []

# Development only: the two JSON Schema test suites skip without it.
[project.optional-dependencies]
dev = ["jsonschema"]

[project.scripts]
texflux = "texflux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The bundled standard flow macros are source, not documentation: the
# compiler reads prelude.tfxm as a package resource at every compilation.
[tool.setuptools.package-data]
texflux = ["*.tfxm"]
