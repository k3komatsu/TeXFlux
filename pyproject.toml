[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "texflux"
version = "0.1.0"
description = "A TeX-first indentation-based preprocessor for structural LaTeX boilerplate"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
texflux = "texflux.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
